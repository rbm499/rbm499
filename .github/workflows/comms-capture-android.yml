name: Comms Capture Android

on:
  push:
    paths:
      - "comms-capture/android/**"
      - "comms-capture/shared/**"
      - ".github/workflows/comms-capture-android.yml"
  pull_request:
    paths:
      - "comms-capture/android/**"
      - "comms-capture/shared/**"
      - ".github/workflows/comms-capture-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      # -PwithApp includes the :app module (needs Google's Maven). Without it only :core exists.
      - name: Core tests and debug APK
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if gradle -p comms-capture/android -PwithApp :core:test :app:assembleDebug --stacktrace 2>&1 | tee build.log; then
              exit 0
            fi
            # Retry only when the failure was fetching dependencies (e.g. Maven Central answering 429 to a shared
            # runner, seen on run 44962878592), never for a compile or test failure, which would just repeat.
            if [ "$attempt" -lt 3 ] && grep -qE "Received status code (429|5[0-9][0-9])|Could not (GET|HEAD) |Read timed out|Connection reset|Remote host terminated" build.log; then
              echo "::warning::dependency download failed on attempt $attempt; retrying after a pause"
              sleep 45
              continue
            fi
            exit 1
          done

      - name: Upload core test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: |
            comms-capture/android/core/build/reports/tests/test
            comms-capture/android/core/build/test-results/test
          if-no-files-found: warn

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: commscap-debug-apk
          path: comms-capture/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
