name: Comms Capture Android

on:
  push:
    paths:
      - "comms-capture/android/**"
      - "comms-capture/shared/**"
      - ".github/workflows/comms-capture-android.yml"
  pull_request:
    paths:
      - "comms-capture/android/**"
      - "comms-capture/shared/**"
      - ".github/workflows/comms-capture-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      # -PwithApp includes the :app module (needs Google's Maven). Without it only :core exists.
      - name: Core tests and debug APK
        run: gradle -p comms-capture/android -PwithApp :core:test :app:assembleDebug --stacktrace

      - name: Upload core test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: |
            comms-capture/android/core/build/reports/tests/test
            comms-capture/android/core/build/test-results/test
          if-no-files-found: warn

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: commscap-debug-apk
          path: comms-capture/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
