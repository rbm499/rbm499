[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commscap"
version = "0.1.0"
description = "Capture, screen, associate and file client texts into job folders, with response-time failsafes"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "anthropic>=0.40",
  "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
commscap = "commscap.cli:main"

[tool.setuptools.packages.find]
include = ["commscap*"]

[tool.setuptools.package-data]
commscap = ["ui/*.html", "ui/*.png", "ui/*.webmanifest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
